# Metadata_Store PostgreSQL untuk pengembangan lokal.
#   docker compose up -d
# lalu set DATABASE_URL di backend/.env dan jalankan migrasi Alembic (lihat backend/alembic.ini).
services:
  postgres:
    image: postgres:17-alpine
    container_name: dashboard_studio_postgres
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: dashboard_studio
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - studio_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d dashboard_studio"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  studio_pg:
